services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CLAUSEGUARD_MODEL: ${CLAUSEGUARD_MODEL:-openai/gpt-4o-mini}
      PIPELINE_MODEL: ${PIPELINE_MODEL:-openai/gpt-4o-mini}
      PIPELINE_MAX_TOKENS: ${PIPELINE_MAX_TOKENS:-900}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
